publiccodeYmlVersion: "0"

name: integration_jupyterhub
url: "https://github.com/SUNET/nextcloud-integration_jupyterhub"
platforms:
  - web

categories:
  - web-collaboration

developmentStatus: development

softwareType: "addon"

description:
  en:
    shortDescription: >
      This app provides an integration point between
      Nextcloud and JupyterHub.

    longDescription: >
      This Nextcloud app provides an integration point between Nextcloud
      and JupyterHub. It registers an OCC command and an admin settings
      page to configure the JupyterHub URL, and uses an OAuth2 client
      configured in Nextcloud so users can authenticate against JupyterHub
      from the Nextcloud instance.

    features:
      - JupyterHub Integration

