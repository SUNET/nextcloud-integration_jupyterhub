debug:
  enabled: true
hub:
  # OCM webapp shares launch as named servers (share-<providerId>), so named
  # servers must be enabled or the hub 400s the start and the /share-<id>/
  # path 404s on the default server.
  allowNamedServers: true
  image:
    name: docker.sunet.se/drive/k8s-hub-ocm
    # Built from hub/Dockerfile (k8s-hub + nextcloud-ocm-jupyterhub).
    # Pin tag to the BASE_TAG used there; replace before deploying.
    tag: REPLACE_ME
  config:
    Authenticator:
      auto_login: true
      enable_auth_state: true
    JupyterHub:
      tornado_settings:
        headers: { 'Content-Security-Policy': "frame-ancestors *;" }
  db:
    pvc:
      storageClassName: csi-sc-cinderplugin
  extraConfig:
    ocm: |
      from nextcloud_ocm_jupyterhub.config import (
          apply_authenticator_defaults,
          apply_services_defaults,
          apply_template_path,
      )

      apply_authenticator_defaults(c, login_service='Sunet Drive')
      apply_services_defaults(c)
      apply_template_path(c)
  networkPolicy:
    ingress:
      - ports:
          - port: 8082
        from:
          - podSelector:
              matchLabels:
                hub.jupyter.org/network-access-hub: "true"
      - ports:
          - port: 8083
        from:
          - podSelector:
              matchLabels:
                hub.jupyter.org/network-access-hub: "true"
  service:
    extraPorts:
      - port: 8082
        targetPort: 8082
        name: refresh-token
      - port: 8083
        targetPort: 8083
        name: ocm
  extraEnv:
    NEXTCLOUD_DEBUG_OAUTH: "no"
    NEXTCLOUD_HOST: sunet.drive.test.sunet.se
    JUPYTER_HOST: jupyter.drive.test.sunet.se
    JUPYTERHUB_API_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-secrets
          key: api-key
    JUPYTERHUB_OCM_API_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-secrets
          key: ocm-api-key
    OCM_TRUSTED_BACK_CHANNEL_DOMAINS: sunet.drive.test.sunet.se
    OCM_TRUSTED_ISSUER_DOMAINS: sunet.drive.test.sunet.se
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-secrets
          key: crypt-key
    NEXTCLOUD_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: nextcloud-oauth-secrets
          key: client-id
    NEXTCLOUD_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: nextcloud-oauth-secrets
          key: client-secret
    networkPolicy:
      enabled: false
proxy:
  chp:
    networkPolicy:
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app: jupyterhub
                  component: hub
          ports:
            - port: 8082
singleuser:
  image:
    name: docker.sunet.se/drive/jupyter-custom
    tag: lab-4.0.10-sunet2
  storage:
    dynamic:
      storageClass: csi-sc-cinderplugin
  extraEnv:
    JUPYTER_ENABLE_LAB: "yes"
  extraFiles:
    jupyter_notebook_config:
      # System-wide jupyter config path. Mounting under ~/.jupyter makes
      # Kubernetes create that dir as root:root 0755, which causes
      # jupyter_core.migrate to crash on PermissionError writing
      # ~/.jupyter/migrated. Use the system-wide config dir instead.
      mountPath: /usr/local/etc/jupyter/jupyter_server_config.py
      stringData: |
        import os
        c = get_config()
        c.NotebookApp.allow_origin = '*'
        c.NotebookApp.tornado_settings = {
            'headers': { 'Content-Security-Policy': "frame-ancestors *;" }
        }
        # OCM share servers sync the shared folder via ocm-sync (WebDAV +
        # bearer); regular OAuth users sync their own Files via nc-sync.
        os.system('if [ -n "$OCM_WEBDAV_URI" ]; then /usr/local/bin/ocm-sync; else /usr/local/bin/nc-sync; fi')
      mode: 0644
