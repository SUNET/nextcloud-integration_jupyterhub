    JUPYTER_HOST: jupyter.drive.test.sunet.se
    JUPYTERHUB_API_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-secrets
          key: api-key
    JUPYTERHUB_OCM_API_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-secrets
          key: ocm-api-key
    OCM_TRUSTED_BACK_CHANNEL_DOMAINS: sunet.drive.test.sunet.se
    OCM_TRUSTED_ISSUER_DOMAINS: sunet.drive.test.sunet.se
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
