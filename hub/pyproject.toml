[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nextcloud-ocm-jupyterhub"
dynamic = ["version"]
description = "JupyterHub-side authenticator and OCM webapp-sharing services that pair with the integration_jupyterhub Nextcloud app."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Micke Nordin", email = "kano@sunet.se" }]
keywords = ["jupyterhub", "ocm", "nextcloud", "oauthenticator", "webapp-sharing"]
classifiers = [
    "Framework :: Jupyter",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "jupyterhub>=5.0",
    "oauthenticator>=17.0",
    "PyJWT[crypto]>=2.8",
    "cryptography>=41",
    "http_sfv>=0.9",
    "requests>=2.31",
    "tornado>=6.4",
]

[project.urls]
Homepage = "https://github.com/SUNET/nextcloud-integration_jupyterhub"
Issues = "https://github.com/SUNET/nextcloud-integration_jupyterhub/issues"

[project.entry-points."jupyterhub.authenticators"]
# Operators can set `c.JupyterHub.authenticator_class = "nextcloud-ocm"`.
nextcloud-ocm = "nextcloud_ocm_jupyterhub.authenticator:NextcloudOAuthenticator"

[project.scripts]
# Names JupyterHub uses in the managed-service `command` list. Mirror the
# legacy filenames so an operator migrating from the exec-based layout only
# needs to swap absolute paths for these console scripts.
nextcloud-ocm-jupyterhub-service = "nextcloud_ocm_jupyterhub.services.ocm:main"
nextcloud-ocm-jupyterhub-refresh-token = "nextcloud_ocm_jupyterhub.services.refresh_token:main"

[tool.hatch.version]
path = "src/nextcloud_ocm_jupyterhub/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nextcloud_ocm_jupyterhub"]

[tool.hatch.build.targets.sdist]
include = ["src/nextcloud_ocm_jupyterhub", "README.md", "pyproject.toml"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
