name: Lint Python (hub)

on:
  pull_request:
  push:
    branches:
      - main
      - stable*

jobs:
  python-lint:
    runs-on: ubuntu-latest
    name: black + isort + syntax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install black isort build

      - name: Build sdist + wheel
        # Catches pyproject.toml/package metadata regressions.
        working-directory: hub
        run: python -m build

      - name: Syntax check (py_compile)
        run: python -m py_compile $(find hub/src -name '*.py')

      - name: isort --check-only
        run: isort --check-only --diff hub/src hub/example

      - name: black --check
        run: black --check --diff hub/src hub/example
